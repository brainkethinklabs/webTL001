media:
  input: assets/uploads
  output: assets/uploads
  extensions: [png, jpg, jpeg, webp]
  rename: random
content:
  - name: home
    label: Portada y SEO
    type: file
    path: content/site.json
    format: json
    fields:
      - {name: title, label: Título para buscadores, type: string, required: true}
      - {name: description, label: Descripción para buscadores, type: text, required: true}
      - {name: headline1, label: Titular primera línea, type: string, required: true}
      - {name: headline2, label: Titular segunda línea, type: string, required: true}
      - {name: headline3, label: Titular tercera línea, type: string, required: true}
      - {name: lead, label: Introducción, type: text, required: true}
      - {name: hero, label: Fotografía principal, type: image, required: true}
      - {name: heroAlt, label: Descripción accesible de la foto, type: string, required: true}
  - name: services
    label: Servicios y galerías
    type: collection
    path: content/services
    format: json
    subfolders: false
    operations: {create: false, rename: false, delete: false}
    view: {primary: title}
    fields:
      - {name: page, label: Página, type: string, readonly: true}
      - {name: title, label: Título SEO, type: string, required: true}
      - {name: description, label: Descripción SEO, type: text, required: true}
      - {name: lead, label: Introducción del servicio, type: text, required: true}
      - {name: summary, label: Resumen en portada, type: text, required: true}
      - name: photos
        label: Fotografías de la galería
        type: object
        list: true
        fields:
          - {name: src, label: Imagen, type: image, required: true}
          - {name: alt, label: Descripción accesible, type: string, required: true}
          - {name: caption, label: Pie de foto, type: string, required: true}
  - name: clients
    label: Logos de clientes
    type: file
    path: content/clients.json
    format: json
    fields:
      - name: clients
        label: Clientes
        type: object
        list: true
        fields:
          - {name: nombre, label: Nombre, type: string, required: true}
          - {name: imagen, label: Logo transparente, type: image, required: true}
          - name: clase
            label: Tamaño
            type: select
            options:
              values:
                - {value: logo-transparent, label: Normal}
                - {value: logo-transparent logo-biochem, label: Ampliado}
